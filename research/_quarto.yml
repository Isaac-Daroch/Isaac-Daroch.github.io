project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - notes/two-maps.qmd
    - notes/demo-protocol.qmd
    - notes/reproducibility.qmd
    - notes/episode-replay.qmd
    - notes/self-model.qmd
  resources:
    - references.bib
website:
  title: "Isaac Daroch · Research Notebook"
  site-url: https://isaac-daroch.github.io/research/
  navbar: false
  search:
    keyboard-shortcut: []
  page-footer: "Educational notes · explicit assumptions and limitations · Isaac Daroch"
bibliography: references.bib
format:
  html:
    theme: [default, theme.scss]
    css: notebook.css
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://isaac-daroch.github.io/assets/paletas.css">
        <link rel="stylesheet" href="https://isaac-daroch.github.io/assets/editorial.css">
        <script type="module" src="https://isaac-daroch.github.io/assets/preferences-runtime.mjs"></script>
        <script type="module" src="https://isaac-daroch.github.io/assets/notebook-search.mjs"></script>
    include-before-body: headers/index.html
    include-after-body: headers/footer.html
    anchor-sections: false
    toc: true
    toc-location: body
    html-math-method: mathml
    code-copy: true
    citations-hover: false
    footnotes-hover: false
    lang: en
execute:
  eval: false
  freeze: false
