name: Resolve remediation dependencies (no deployment)
on:
  push:
    branches: [remediation/d1-validation]
    paths: [.github/workflows/resolve-d1-dependencies.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
        with:
          ref: remediation/d1-validation
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # verified v6
        with:
          node-version: '24.19.0'
      - name: Resolve the audited dependencies and verification tools
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p site
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("site/package.json",JSON.stringify({name:"isaac-daroch-research",version:"1.1.0-rc.1",private:true,type:"module",engines:{node:">=22.22.0",npm:">=10"},dependencies:{astro:"7.4.0",gsap:"3.13.0",three:"0.186.1"}},null,2)+"\n");'
          cd site
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @astrojs/check typescript @playwright/test @axe-core/playwright
          npm ci --ignore-scripts
          npm ls --depth=0
          npm audit --json > dependency-audit.json || true
          node --version > resolution-environment.txt
          npm --version >> resolution-environment.txt
          node -e 'const fs=require("fs"),z=require("zlib"),c=require("crypto");const b=fs.readFileSync("package-lock.json");fs.writeFileSync("package-lock.json.gz.b64",z.gzipSync(b).toString("base64"));fs.writeFileSync("package-lock.sha256",c.createHash("sha256").update(b).digest("hex")+"\n");'
      - name: Preserve dependency resolution on this work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/package.json site/package-lock.json site/package-lock.json.gz.b64 site/package-lock.sha256 site/dependency-audit.json site/resolution-environment.txt
          git commit -m 'build: record resolved dependencies and npm audit evidence'
          git push origin HEAD:remediation/d1-validation
