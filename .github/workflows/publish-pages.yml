name: Publish explicitly approved verified website
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full current main commit with a successful Integrated website verification run'
        required: true
        type: string
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: public-website-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/publish '))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.authorize.outputs.commit }}
      content_digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Authorize a successful current-main artifact
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/authorize-publication.py
      - name: Retrieve exactly the already-tested site
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ steps.authorize.outputs.run_id }}
        run: gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name verified-static-site --dir release-site
      - name: Verify source identity and every downloaded file
        env:
          EXPECTED_COMMIT: ${{ steps.authorize.outputs.commit }}
        run: node tools/check-publish-artifact.mjs release-site
      - name: Read verified content identity
        id: identity
        run: node -e 'const fs=require("fs");fs.appendFileSync(process.env.GITHUB_OUTPUT,"digest="+JSON.parse(fs.readFileSync("release-site/release.json")).contentDigest+"\n")'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: release-site
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify-live:
    needs: [prepare, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Check live routes and authorized release identity
        env:
          EXPECTED_SOURCE: ${{ needs.prepare.outputs.commit }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.content_digest }}
        run: |
          mkdir -p release-site
          node -e 'require("fs").writeFileSync("release-site/release.json",JSON.stringify({sourceCommit:process.env.EXPECTED_SOURCE,contentDigest:process.env.EXPECTED_DIGEST}))'
          node tools/post-deploy.mjs release-site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-verification
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 30
