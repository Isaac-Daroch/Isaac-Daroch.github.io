name: Record first integrated assets and lock metadata
on:
  push:
    branches: [release/integrated-d2]
    paths: [.github/workflows/bootstrap-integrated-assets.yml]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Record approved public profile asset once
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/bootstrap-assets.py
          cd site
          npm install --package-lock-only --ignore-scripts
      - name: Preserve actual resolved source inputs on work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/package-lock.json site/public/images/portrait.png docs/integration/asset-provenance.json
          git diff --cached --quiet || git commit -m 'build: record profile asset and synchronized authentic dependency lock'
          git push origin HEAD:release/integrated-d2
