name: V2 self-model and preference kernels
on:
  push:
    branches: [feature/v2-self-model-grafito]
    paths: ['site/src/modules/self-model/**', 'site/src/modules/preferences/**', 'tokens/**', 'tests/self-model.test.mjs', 'tests/preferences.test.mjs', 'tools/verify-contrast.mjs', '.github/workflows/v2-kernel.yml']
permissions:
  contents: read
jobs:
  kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Execute distinct domain and token tests
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --test tests/self-model.test.mjs tests/preferences.test.mjs 2>&1 | tee evidence/v2-kernels.log
          node tools/verify-contrast.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v2-kernels
          path: evidence/
          retention-days: 30
