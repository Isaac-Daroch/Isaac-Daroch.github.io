name: V2 preserve semantic incoming anchors (feature only)
on:
  push:
    branches: [feature/v2-self-model-grafito]
    paths: [.github/workflows/v2-anchor-repair.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.ref == 'refs/heads/feature/v2-self-model-grafito'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/v2-self-model-grafito
      - name: Preserve old published anchor without weakening verification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='site/src/components/EditorialPage.astro';const s=fs.readFileSync(file,'utf8');
          const target='<section class="section" id="lab"><div class="shell grid two">';
          if(s.includes(target))fs.writeFileSync(file,s.replace(target,'<section class="section" id="lab"><div class="shell grid two" id="demo">'));
          else if(!s.includes('id="demo"'))throw Error('Expected semantic observatory introduction not found');
          console.log('The existing #demo link identifies the actual observatory introduction. #lab remains valid.');
          console.log('Actual tools: '+fs.readdirSync('tools').join(', '));
          for(const f of ['site/package.json','tools/verify-dist.mjs','research/_quarto.yml','research/_includes/before-body.html'])if(fs.existsSync(f))console.log('\n===== '+f+' =====\n'+fs.readFileSync(f,'utf8'));
          NODE
      - name: Record change only on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/src/components/EditorialPage.astro
          if git diff --cached --quiet; then echo 'Anchor already present'; else git commit -m 'fix(v2): preserve inbound demo fragment at real observatory introduction'; git push origin HEAD:feature/v2-self-model-grafito; fi
